<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">dsh-lanya · 有记忆，也有自己的日常</title><desc id="desc">适合手机阅读的原创品牌横幅：同一个主 LLM，带着记忆决定下一件想做的事。</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#f3f8fa"/><stop offset="1" stop-color="#eaf3f3"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d7e5e7" stroke-width=".6" opacity=".45"/></pattern></defs><rect width="640" height="360" rx="24" fill="url(#background)"/><rect width="640" height="360" rx="24" fill="url(#grid)"/><g fill="none" stroke="#d7e5e7"><circle cx="610" cy="280" r="118"/><circle cx="610" cy="280" r="150"/></g><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><circle cx="41" cy="45" r="4" fill="#157c85"/><text x="55" y="49" fill="#157c85" font-size="12" letter-spacing="2">DSH · QQ CHARACTER FRAMEWORK</text><text x="37" y="140" fill="#18313f" font-size="68" font-weight="700" letter-spacing="-2">dsh-lanya<tspan dx="14" fill="#157c85" font-size="32" letter-spacing="1">岚娅</tspan></text><text x="41" y="197" fill="#18313f" font-size="30" font-weight="600">有记忆，也有自己的日常。</text><text x="42" y="245" fill="#647d89" font-size="18">同一个主 LLM，带着记忆</text><text x="42" y="275" fill="#647d89" font-size="18">决定下一件想做的事。</text><path d="M42 320h23" stroke="#157c85" stroke-width="2"/><text x="77" y="324" fill="#157c85" font-size="13" letter-spacing="2">会话 / 记忆 / 自主</text></g></svg>
