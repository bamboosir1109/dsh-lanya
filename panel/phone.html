<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>真实 Android 屏幕</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e5eaf2;font:15px/1.6 system-ui,sans-serif}
main{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:23px;margin:0}a{color:#a2caff}p{color:#a7b4c7;margin:8px 0 18px}
.layout{display:grid;grid-template-columns:minmax(240px,1fr) minmax(260px,330px);gap:22px;align-items:start}
.screen{min-height:320px;background:#080b10;border:1px solid #384457;border-radius:12px;padding:12px;display:grid;place-items:center}
#shot{display:block;max-width:100%;max-height:76vh;width:auto;height:auto;touch-action:none;user-select:none}
[hidden]{display:none!important}#placeholder{color:#a7b4c7;text-align:center;padding:35px}
.controls{background:#192231;border:1px solid #384457;border-radius:12px;padding:16px}
label{display:block;margin:12px 0 5px;font-size:13px;color:#bdcadd}input,select,button{font:inherit}
input,select{width:100%;padding:8px;background:#10151e;border:1px solid #53617a;border-radius:6px;color:inherit}
button{border:1px solid #53617a;border-radius:6px;background:#26364d;color:inherit;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#capture{background:#285990}.meta{overflow-wrap:anywhere;font-size:13px;color:#a7b4c7}
#error{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffb9b9;border-left:3px solid #d06464;padding-left:10px}
.hint{font-size:12px}form{border-top:1px solid #384457;margin-top:15px;padding-top:2px}
@media(max-width:700px){main{padding:16px}.layout{grid-template-columns:1fr}.screen{min-height:230px}}
</style>
</head>
<body>
<main>
  <header><h1>真实 Android 屏幕</h1><a href="./">返回控制台</a></header>
  <p>画面只来自设备截屏。每次操作后重新采集；离线或截图过期时不能操作。</p>
  <div class="layout">
    <section>
      <div class="screen">
        <div id="placeholder">尚未采集设备画面</div>
        <img id="shot" alt="Android 设备最近一次验证通过的截图" hidden draggable="false">
      </div>
      <div id="frameInfo" class="meta">没有可操作的截图</div>
    </section>
    <section class="controls">
      <label for="serial">固定设备 serial</label><input id="serial" readonly aria-label="固定设备 serial">
      <div class="row"><button id="capture" disabled>截取屏幕</button><button id="refresh">刷新状态</button></div>
      <div id="status" role="status" aria-live="polite">正在读取本地接口</div>
      <div id="error" role="alert" hidden></div>
      <label for="gesture">在真实截图上操作</label>
      <select id="gesture"><option value="tap">点按</option><option value="longtap">长按</option><option value="swipe">拖动滑动</option></select>
      <div class="row">
        <button data-key="BACK" data-needs-view disabled>返回</button>
        <button data-key="HOME" data-needs-view disabled>主页</button>
        <button data-key="APP_SWITCH" data-needs-view disabled>最近应用</button>
      </div>
      <form id="textForm"><label for="text">向当前输入框输入文本</label>
        <input id="text" maxlength="2000" autocomplete="off">
        <div class="row"><button data-needs-view disabled>输入文本</button></div>
      </form>
      <form id="startForm"><label for="package">启动已安装应用的包名</label>
        <input id="package" placeholder="com.example.app" autocomplete="off">
        <div class="row"><button data-needs-view disabled>启动应用</button></div>
      </form>
      <p class="hint">此页不启动模拟器或 worker。接口不可用时，请从控制台服务打开此页，并检查 Android worker。</p>
    </section>
  </div>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const image = el('shot');
const state = {serial:'', seq:null, frame:null, candidate:null, busy:false, epoch:0, expiresAt:0, reading:false};
let pointer = null;

function controls(){
  const usable = Boolean(state.frame) && !state.busy && Date.now() < state.expiresAt;
  document.querySelectorAll('[data-needs-view]').forEach(button => { button.disabled = !usable; });
  el('capture').disabled = !state.serial || state.busy;
  return usable;
}
function clearFrame(message){
  state.frame = null; state.candidate = null; state.expiresAt = 0; pointer = null;
  image.onload = image.onerror = null; image.hidden = true; image.removeAttribute('src');
  el('placeholder').hidden = false;
  el('placeholder').textContent = message || '没有可操作的设备画面';
  el('frameInfo').textContent = '没有可操作的截图';
  controls();
}
function fail(message){
  state.epoch++; state.busy = false; state.seq = null;
  clearFrame('离线、失败或截图已失效');
  el('status').textContent = '不可操作';
  el('error').textContent = message; el('error').hidden = false;
}
async function request(path, options){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch('/api/android/' + path, {cache:'no-store', ...options, signal:controller.signal});
    let data;
    try { data = await response.json(); } catch (_) { throw new Error('Android 接口没有返回 JSON，请从控制台服务打开此页'); }
    if (!response.ok) throw new Error(data.error || data.code || ('HTTP ' + response.status));
    return data;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('Android 接口超时，请重新截图');
    throw error;
  } finally { clearTimeout(timeout); }
}
function display(data){
  if (data.serial !== state.serial || data.seq !== state.seq ||
      typeof data.shot_id !== 'string' || !/^[0-9a-f]{32}$/.test(data.shot_id) ||
      !Number.isInteger(data.width) || data.width <= 0 || !Number.isInteger(data.height) || data.height <= 0 ||
      !Number.isFinite(data.age_seconds) || !Number.isFinite(data.max_age) ||
      data.age_seconds < 0 || data.age_seconds >= data.max_age) {
    fail('截图与当前设备或请求不匹配，请重新截图'); return;
  }
  if (state.frame && state.frame.shot_id === data.shot_id) { controls(); return; }
  if (state.candidate && state.candidate.shot_id === data.shot_id) return;
  clearFrame('正在验证截图文件');
  state.busy = false;
  state.candidate = data;
  state.expiresAt = Date.now() + (data.max_age - data.age_seconds) * 1000;
  const ticket = state.epoch;
  image.onload = () => {
    if (ticket !== state.epoch || !state.candidate || state.candidate.shot_id !== data.shot_id) return;
    if (Date.now() >= state.expiresAt || image.naturalWidth !== data.width || image.naturalHeight !== data.height) {
      fail('截图已过期或图像尺寸不匹配'); return;
    }
    state.frame = data; state.candidate = null;
    image.hidden = false; el('placeholder').hidden = true;
    el('status').textContent = '已取得真实截图';
    el('frameInfo').textContent = data.serial + ' · ' + data.width + ' × ' + data.height +
      ' · ' + new Date(data.captured_at * 1000).toLocaleString() + ' · ' + data.shot_id;
    el('error').textContent = ''; el('error').hidden = true;
    controls();
  };
  image.onerror = () => { if (ticket === state.epoch) fail('截图文件读取失败，请重新截图'); };
  image.src = '/api/android/shot?serial=' + encodeURIComponent(data.serial) + '&shot_id=' + encodeURIComponent(data.shot_id);
  controls();
}
async function refreshStatus(){
  if (state.reading) return;
  state.reading = true;
  const ticket = state.epoch;
  try {
    const data = await request('status' + (state.serial ? '?serial=' + encodeURIComponent(state.serial) : ''));
    if (ticket !== state.epoch) return;
    if (!state.serial) {
      if (typeof data.serial !== 'string' || !/^[A-Za-z0-9._:-]{1,128}$/.test(data.serial)) throw new Error('未配置有效的 Android serial');
      state.serial = data.serial; el('serial').value = data.serial;
    }
    if (data.serial !== state.serial) throw new Error('设备 serial 已改变，请重新打开页面');
    if (state.seq === null && data.ok === true) {
      el('status').textContent = '点击「截取屏幕」获取新的设备画面'; controls(); return;
    }
    if (data.ok === true && data.status === 'observed') { display(data); return; }
    if (data.status === 'pending' && state.seq !== null && data.seq === state.seq) {
      state.busy = true; clearFrame('设备正在处理请求');
      el('status').textContent = '等待 Android worker 的真实结果'; return;
    }
    if (data.code === 'capture_required' && state.seq === null) {
      clearFrame('尚未采集设备画面'); el('status').textContent = '点击「截取屏幕」开始'; return;
    }
    throw new Error(data.error || data.code || 'Android 设备不可用');
  } catch (error) {
    if (ticket === state.epoch) fail(String(error.message || error));
  } finally { state.reading = false; }
}
async function submit(action, fields={}){
  if (state.busy || !state.serial) return;
  if (action !== 'shot' && !controls()) { fail('先获取新的截图，再操作'); return; }
  const job = {...fields, action, serial:state.serial};
  if (action !== 'shot') job.expected_shot_id = state.frame.shot_id;
  state.epoch++; const ticket = state.epoch;
  state.busy = true; state.seq = null;
  clearFrame('等待设备处理请求'); el('status').textContent = '正在提交请求';
  try {
    const data = await request('job', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(job)});
    if (ticket !== state.epoch) return;
    if (data.status !== 'pending' || !Number.isSafeInteger(data.seq) || data.seq < 1 || data.serial !== state.serial) {
      throw new Error('请求没有获得有效排队回执');
    }
    state.seq = data.seq; el('status').textContent = '已排队，等待真实截图';
  } catch (error) { if (ticket === state.epoch) fail(String(error.message || error)); }
  if (ticket === state.epoch) await refreshStatus();
}
function coordinate(event){
  if (!controls()) return null;
  const bounds = image.getBoundingClientRect();
  if (bounds.width <= 0 || bounds.height <= 0) return null;
  const x = Math.floor((event.clientX - bounds.left) / bounds.width * state.frame.width);
  const y = Math.floor((event.clientY - bounds.top) / bounds.height * state.frame.height);
  return x >= 0 && y >= 0 && x < state.frame.width && y < state.frame.height ? {x,y} : null;
}
image.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  const point = coordinate(event);
  if (point) { pointer = {...point, id:event.pointerId}; image.setPointerCapture(event.pointerId); event.preventDefault(); }
});
image.addEventListener('pointerup', event => {
  const start = pointer, end = coordinate(event); pointer = null;
  if (!start || !end || start.id !== event.pointerId) return;
  const mode = el('gesture').value;
  if (mode === 'swipe') submit('swipe', {x1:start.x, y1:start.y, x2:end.x, y2:end.y, ms:300});
  else if (mode === 'longtap') submit('longtap', {x:end.x, y:end.y, ms:800});
  else submit('tap', end);
});
image.addEventListener('pointercancel', () => { pointer = null; });
el('capture').addEventListener('click', () => submit('shot'));
el('refresh').addEventListener('click', refreshStatus);
document.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => submit('key', {key:button.dataset.key})));
el('textForm').addEventListener('submit', event => { event.preventDefault(); submit('text', {text:el('text').value}); });
el('startForm').addEventListener('submit', event => { event.preventDefault(); submit('start', {pkg:el('package').value}); });
setInterval(refreshStatus, 1500);
setInterval(() => { if ((state.frame || state.candidate) && Date.now() >= state.expiresAt) fail('截图已过期，请重新截图'); }, 250);
window.__androidPhone = {refreshStatus, submit, controls};
refreshStatus();
</script>
</body>
</html>
