<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>岚娅的手机</title>
<style>
:root{
  --ink:#0b0d13; --ink2:#151922; --ink3:#1f2532;
  --line:#2b3242; --text:#e8ecf5; --dim:#8b96ab;
  --accent:#5ba7ff; --ok:#3ddc84; --warn:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070b;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text);overflow:hidden}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

/* ---------- 手机外框 ---------- */
#phone{
  width:390px;height:844px;border-radius:44px;position:relative;
  background:var(--ink);overflow:hidden;
  box-shadow:0 0 0 10px #14171f, 0 0 0 12px #232833, 0 26px 70px rgba(0,0,0,.75);
  display:flex;flex-direction:column;
}
#notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:124px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:60;
}
/* ---------- 状态栏 ---------- */
#status{
  height:44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 5px;font-size:12px;font-weight:600;letter-spacing:.3px;
  color:var(--text);flex:0 0 auto;position:relative;z-index:55
}
#status .right{display:flex;gap:5px;align-items:center}
.batt{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;
  position:relative;opacity:.9}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;
  background:currentColor;border-radius:0 1px 1px 0}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;background:currentColor;
  border-radius:1px;width:70%}

/* ---------- 屏幕 ---------- */
#screen{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;
  background:linear-gradient(170deg,#0f1420,#0a0d14 60%)}
.view.on{display:flex}

/* ---------- 主屏 ---------- */
#home{flex-direction:column}
#homeTop{padding:12px 24px 4px;flex:0 0 auto}
#clock{font-size:52px;font-weight:250;letter-spacing:-2px;line-height:1.05}
#date{font-size:12.5px;color:var(--dim);margin-top:2px}
#grid{
  flex:1;display:grid;grid-template-columns:repeat(4,1fr);
  gap:20px 4px;padding:22px 16px;align-content:start;overflow-y:auto
}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;user-select:none;transition:transform .12s}
.app:active{transform:scale(.9)}
.app .ic{
  width:62px;height:62px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:29px;
  background:linear-gradient(160deg,#2b3446,#1a2029);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.45)
}
.app .nm{font-size:10.5px;color:var(--dim);text-align:center;
  max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pages{display:flex;justify-content:center;gap:6px;padding:0 0 12px;flex:0 0 auto}
#pages i{width:6px;height:6px;border-radius:50%;background:#2c3444}
#pages i.on{background:#c9d4e6}

/* ---------- 通用 App 界面 ---------- */
.tbar{
  height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line);flex:0 0 auto;background:rgba(20,24,33,.9);
  backdrop-filter:blur(8px)
}
.tbar .back{font-size:20px;color:var(--accent);cursor:pointer;width:26px}
.tbar .ttl{font-size:15px;font-weight:600}
.body{flex:1;overflow-y:auto;padding:14px;font-size:13.5px;line-height:1.6}
.body::-webkit-scrollbar{width:0}

.card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:10px}
.card h4{margin:0 0 7px;font-size:13px;color:var(--accent);font-weight:600}
.card p{margin:0;color:var(--dim);font-size:12.5px}
.row{display:flex;justify-content:space-between;align-items:center;
  padding:11px 2px;border-bottom:1px solid rgba(43,50,66,.6);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--dim)}
.row .v{font-variant-numeric:tabular-nums}
.empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:12.5px}

/* ---------- 计算器 ---------- */
#calc{display:flex;flex-direction:column;height:100%}
#calcOut{flex:0 0 auto;padding:26px 20px 14px;text-align:right;
  font-size:42px;font-weight:250;letter-spacing:-1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#calcKeys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:10px 14px 22px}
#calcKeys button{
  border:0;border-radius:50%;font-size:20px;font-weight:500;color:var(--text);
  background:#232a38;cursor:pointer;font-family:inherit
}
#calcKeys button:active{filter:brightness(1.5)}
#calcKeys button.op{background:#3d4a63}
#calcKeys button.eq{background:var(--accent);color:#05121f;font-weight:700}
#calcKeys button.wide{grid-column:span 2;border-radius:26px}

/* ---------- 相册 ---------- */
#gal{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
#gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;cursor:pointer}
#galView{position:absolute;inset:0;background:#000;display:none;
  align-items:center;justify-content:center;z-index:80}
#galView.on{display:flex}
#galView img{max-width:100%;max-height:100%;object-fit:contain}
#galView .x{position:absolute;top:52px;right:18px;font-size:22px;color:#fff;cursor:pointer}

/* ---------- 游戏：贪吃蛇 ---------- */
#gameWrap{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:12px}
#snakeCv{background:#0a0f18;border-radius:14px;border:1px solid var(--line);
  touch-action:none}
#gameHud{display:flex;gap:22px;font-size:12.5px;color:var(--dim)}
#gameHud b{color:var(--text);font-variant-numeric:tabular-nums}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);
  gap:5px;margin-top:4px}
#dpad button{
  border:0;border-radius:12px;background:#232a38;color:var(--text);
  font-size:19px;cursor:pointer;font-family:inherit
}
#dpad button:active{background:#33405a}
#dpad .sp{background:transparent;pointer-events:none}
#gameMsg{font-size:12px;color:var(--warn);min-height:16px}

/* ---------- 备忘录 ---------- */
#memoList .memo{background:var(--ink2);border-radius:12px;padding:11px 13px;
  margin-bottom:8px;font-size:12.5px;border-left:3px solid var(--accent)}
#memoList .memo .t{font-size:10.5px;color:var(--dim);margin-bottom:3px}

/* ---------- 聊天 ---------- */
#chatBody{display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:8px 12px;border-radius:14px;font-size:12.5px;
  line-height:1.45;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--accent);color:#05121f}
.bub.them{align-self:flex-start;background:var(--ink3)}
.bub .who{font-size:10px;opacity:.7;margin-bottom:2px}

/* ---------- 底部横条 ---------- */
#hbar{height:5px;width:132px;border-radius:3px;background:#39404f;
  margin:6px auto 8px;flex:0 0 auto;cursor:pointer}
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="notch"></div>

    <div id="status">
      <span id="stTime">9:41</span>
      <span class="right">
        <span id="stSig">●●●</span>
        <span class="batt"><i id="stBatt"></i></span>
      </span>
    </div>

    <div id="screen">

      <!-- ============ 主屏 ============ -->
      <div class="view on" id="home">
        <div id="homeTop">
          <div id="clock">9:41</div>
          <div id="date"></div>
        </div>
        <div id="grid"></div>
        <div id="pages"><i class="on"></i><i></i></div>
      </div>

      <!-- ============ 通用外壳（由 JS 填充） ============ -->
      <div class="view" id="appview">
        <div class="tbar">
          <span class="back" onclick="goHome()">‹</span>
          <span class="ttl" id="appTitle">应用</span>
        </div>
        <div class="body" id="appBody"></div>
      </div>

      <!-- ============ 计算器 ============ -->
      <div class="view" id="calcView">
        <div id="calc">
          <div id="calcOut">0</div>
          <div id="calcKeys">
            <button onclick="ck('C')" class="op">C</button>
            <button onclick="ck('±')" class="op">±</button>
            <button onclick="ck('%')" class="op">%</button>
            <button onclick="ck('/')" class="op">÷</button>
            <button onclick="ck('7')">7</button>
            <button onclick="ck('8')">8</button>
            <button onclick="ck('9')">9</button>
            <button onclick="ck('*')" class="op">×</button>
            <button onclick="ck('4')">4</button>
            <button onclick="ck('5')">5</button>
            <button onclick="ck('6')">6</button>
            <button onclick="ck('-')" class="op">−</button>
            <button onclick="ck('1')">1</button>
            <button onclick="ck('2')">2</button>
            <button onclick="ck('3')">3</button>
            <button onclick="ck('+')" class="op">+</button>
            <button onclick="ck('0')" class="wide">0</button>
            <button onclick="ck('.')">.</button>
            <button onclick="ck('=')" class="eq">=</button>
          </div>
        </div>
      </div>

      <!-- ============ 相册 ============ -->
      <div class="view" id="galViewWrap">
        <div class="tbar">
          <span class="back" onclick="goHome()">‹</span>
          <span class="ttl">相册</span>
        </div>
        <div class="body" style="padding:0">
          <div id="gal"></div>
        </div>
        <div id="galView" onclick="closeGal()">
          <span class="x" onclick="closeGal()">✕</span>
          <img id="galBig" alt="">
        </div>
      </div>

      <!-- ============ 贪吃蛇 ============ -->
      <div class="view" id="gameView">
        <div class="tbar">
          <span class="back" onclick="goHome()">‹</span>
          <span class="ttl">贪吃蛇</span>
          <span style="margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer"
                onclick="snakeReset()">重开</span>
        </div>
        <div id="gameWrap">
          <div id="gameHud">分数 <b id="gScore">0</b> · 最高 <b id="gBest">0</b></div>
          <canvas id="snakeCv" width="300" height="300"></canvas>
          <div id="dpad">
            <button class="sp"></button><button onclick="snakeDir(0,-1)">▲</button><button class="sp"></button>
            <button onclick="snakeDir(-1,0)">◀</button><button class="sp"></button><button onclick="snakeDir(1,0)">▶</button>
            <button class="sp"></button><button onclick="snakeDir(0,1)">▼</button><button class="sp"></button>
          </div>
          <div id="gameMsg"></div>
        </div>
      </div>

    </div>
    <div id="hbar" onclick="goHome()"></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:19389/api';
const RAW = 'http://127.0.0.1:19388/api/files/raw';
const PANEL = 'http://127.0.0.1:19388/';

/* ---------------------------------------------------------- 通用请求 */
async function api(path, opt){
  try{
    const r = await fetch(API + path, Object.assign({cache:'no-store'}, opt||{}));
    return await r.json();
  }catch(e){ return {ok:false, error:String(e)}; }
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------------------------------------------------- 导航 */
const views = ['home','appview','calcView','galViewWrap','gameView'];
function show(id){
  views.forEach(v => document.getElementById(v).classList.toggle('on', v===id));
  if(id==='home') { tickClock(); }
}
function goHome(){ show('home'); stopSnake(); }
function openApp(title, html){
  document.getElementById('appTitle').textContent = title;
  document.getElementById('appBody').innerHTML = html;
  show('appview');
  document.getElementById('appBody').scrollTop = 0;
}

/* ---------------------------------------------------------- 时钟 */
function pad(n){ return n<10?('0'+n):String(n); }
function tickClock(){
  const d = new Date();
  const t = d.getHours()+':'+pad(d.getMinutes());
  document.getElementById('clock').textContent = t;
  document.getElementById('stTime').textContent = t;
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('date').textContent =
    (d.getMonth()+1)+'月'+d.getDate()+'日 '+wd;
}
tickClock(); setInterval(tickClock, 15000);

/* ---------------------------------------------------------- 应用表 */
const APPS = [
  {id:'browser', nm:'浏览器', ic:'🌐', open:openBrowser},
  {id:'notes',   nm:'备忘录', ic:'📝', open:openNotes},
  {id:'gallery', nm:'相册',   ic:'🖼️', open:openGallery},
  {id:'snake',   nm:'贪吃蛇', ic:'🐍', open:openSnake},
  {id:'calc',    nm:'计算器', ic:'🧮', open:()=>show('calcView')},
  {id:'bili',    nm:'B站',   ic:'📺', open:openBili},
  {id:'chat',    nm:'聊天',   ic:'💬', open:openChat},
  {id:'money',   nm:'零花钱', ic:'💰', open:openMoney},
  {id:'files',   nm:'文件',   ic:'📁', open:openFiles},
  {id:'panel',   nm:'控制台', ic:'⚙️', open:openPanel},
];

(function buildGrid(){
  const g = document.getElementById('grid');
  APPS.forEach(a => {
    const d = document.createElement('div');
    d.className = 'app';
    d.setAttribute('data-app', a.id);
    d.innerHTML = '<div class="ic">'+a.ic+'</div><div class="nm">'+a.nm+'</div>';
    d.onclick = a.open;
    g.appendChild(d);
  });
})();

/* ---------------------------------------------------------- 浏览器 */
function openBrowser(){
  openApp('浏览器', `
    <div class="card">
      <h4>输入网址</h4>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="urlIn" value="https://www.bilibili.com"
               style="flex:1;background:#0d1119;border:1px solid var(--line);
                      border-radius:9px;padding:9px 11px;color:var(--text);
                      font-size:12.5px;font-family:inherit">
        <button onclick="goUrl()"
                style="border:0;border-radius:9px;background:var(--accent);
                       color:#05121f;font-weight:700;padding:0 15px;cursor:pointer;
                       font-family:inherit;font-size:12.5px">前往</button>
      </div>
    </div>
    <div class="card"><h4>说明</h4>
      <p>这里的浏览器只是给你看个位置。真要上网，用你自己那套 —— 
      她能打开网页、点按钮、看截图。</p></div>
    <div class="card"><h4>常用</h4>
      <p><a href="https://www.bilibili.com" target="_blank" style="color:var(--accent)">B站</a> ·
         <a href="https://tieba.baidu.com" target="_blank" style="color:var(--accent)">贴吧</a> ·
         <a href="https://www.douban.com" target="_blank" style="color:var(--accent)">豆瓣</a></p></div>`);
}
function goUrl(){
  const v = document.getElementById('urlIn').value.trim();
  if(!v) return;
  window.open(/^https?:/.test(v)?v:('https://'+v), '_blank');
}

/* ---------------------------------------------------------- 备忘录 */
async function openNotes(){
  openApp('备忘录', '<div class="empty">读取中…</div>');
  const j = await api('/files?dir=notes');
  const fs = (j.files||[]).filter(f => /\.(md|txt)$/i.test(f.name)).slice(0,40);
  if(!fs.length){ document.getElementById('appBody').innerHTML =
    '<div class="empty">备忘录是空的</div>'; return; }
  let h = '<div id="memoList">';
  fs.forEach(f => {
    h += '<div class="memo" onclick="readNote(\''+esc(f.name).replace(/'/g,"\\'")+'\')">'
       + '<div class="t">'+new Date(f.mtime*1000).toLocaleString('zh-CN',
           {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div>'
       + esc(f.name) + '</div>';
  });
  h += '</div>';
  document.getElementById('appBody').innerHTML = h;
}
async function readNote(name){
  openApp(name, '<div class="empty">读取中…</div>');
  const j = await api('/files/read?dir=notes&name='+encodeURIComponent(name));
  const txt = j.ok ? (j.text || j.content || '') : ('读不到：'+(j.error||''));
  document.getElementById('appBody').innerHTML =
    '<div class="card"><h4>'+esc(name)+'</h4><p style="white-space:pre-wrap;color:var(--text)">'
    + esc(String(txt).slice(0,4000)) + '</p></div>';
}

/* ---------------------------------------------------------- 相册 */
async function openGallery(){
  show('galViewWrap');
  const g = document.getElementById('gal');
  g.innerHTML = '<div class="empty" style="grid-column:1/-1">读取中…</div>';
  const j = await api('/files?dir=made');
  const imgs = (j.files||[]).filter(f => /\.(png|jpe?g|gif|webp)$/i.test(f.name));
  if(!imgs.length){ g.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有画</div>'; return; }
  g.innerHTML = imgs.map(f =>
    '<img src="'+RAW+'?dir=made&name='+encodeURIComponent(f.name)+'" loading="lazy" '
    + 'onclick="bigGal(\''+encodeURIComponent(f.name)+'\')">').join('');
}
function bigGal(n){
  document.getElementById('galBig').src = RAW+'?dir=made&name='+n;
  document.getElementById('galView').classList.add('on');
}
function closeGal(){ document.getElementById('galView').classList.remove('on'); }

/* ---------------------------------------------------------- 贪吃蛇 */
let sn = null, snTimer = null;
function openSnake(){
  show('gameView');
  document.getElementById('gBest').textContent = localStorage.getItem('snBest') || '0';
  snakeReset();
}
function snakeReset(){
  stopSnake();
  const N = 15, S = 20;
  sn = {N, S, x:7, y:7, dx:1, dy:0, body:[[7,7],[6,7],[5,7]],
        food:[11,7], score:0, dead:false, tick:0};
  document.getElementById('gScore').textContent = '0';
  document.getElementById('gameMsg').textContent = '';
  snakeDraw();
  snTimer = setInterval(snakeStep, 170);
}
function stopSnake(){ if(snTimer){ clearInterval(snTimer); snTimer = null; } }
function snakeDir(dx, dy){
  if(!sn || sn.dead) return;
  if(dx === -sn.dx && dy === -sn.dy) return;   // 不能原地掉头
  sn.dx = dx; sn.dy = dy;
}
function snakeStep(){
  if(!sn || sn.dead) return;
  const nx = sn.x + sn.dx, ny = sn.y + sn.dy;
  if(nx < 0 || ny < 0 || nx >= sn.N || ny >= sn.N
     || sn.body.some(p => p[0]===nx && p[1]===ny)){
    sn.dead = true; stopSnake();
    document.getElementById('gameMsg').textContent = '撞了！点「重开」再来';
    const best = Math.max(+(localStorage.getItem('snBest')||0), sn.score);
    localStorage.setItem('snBest', best);
    document.getElementById('gBest').textContent = best;
    return;
  }
  sn.x = nx; sn.y = ny;
  sn.body.unshift([nx, ny]);
  if(nx === sn.food[0] && ny === sn.food[1]){
    sn.score += 10;
    document.getElementById('gScore').textContent = sn.score;
    let f;
    do { f = [Math.floor(Math.random()*sn.N), Math.floor(Math.random()*sn.N)]; }
    while(sn.body.some(p => p[0]===f[0] && p[1]===f[1]));
    sn.food = f;
  } else {
    sn.body.pop();
  }
  snakeDraw();
}
function snakeDraw(){
  const cv = document.getElementById('snakeCv');
  if(!cv || !sn) return;
  const c = cv.getContext('2d');
  c.fillStyle = '#0a0f18'; c.fillRect(0,0,cv.width,cv.height);
  const S = cv.width / sn.N;
  c.strokeStyle = 'rgba(43,50,66,.55)'; c.lineWidth = 1;
  for(let i=1;i<sn.N;i++){
    c.beginPath(); c.moveTo(i*S,0); c.lineTo(i*S,cv.height); c.stroke();
    c.beginPath(); c.moveTo(0,i*S); c.lineTo(cv.width,i*S); c.stroke();
  }
  c.fillStyle = '#ff5f6d';
  c.beginPath();
  c.arc((sn.food[0]+.5)*S, (sn.food[1]+.5)*S, S*.34, 0, Math.PI*2);
  c.fill();
  sn.body.forEach((p,i) => {
    c.fillStyle = i===0 ? '#5ba7ff' : 'rgba(91,167,255,'+(0.85-i*0.02)+')';
    const pad = i===0 ? 1.4 : 2.2;
    c.beginPath();
    c.roundRect(p[0]*S+pad, p[1]*S+pad, S-pad*2, S-pad*2, 4);
    c.fill();
  });
}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
  };
}
document.addEventListener('keydown', e => {
  if(!document.getElementById('gameView').classList.contains('on')) return;
  if(e.key==='ArrowUp') snakeDir(0,-1);
  else if(e.key==='ArrowDown') snakeDir(0,1);
  else if(e.key==='ArrowLeft') snakeDir(-1,0);
  else if(e.key==='ArrowRight') snakeDir(1,0);
  else return;
  e.preventDefault();
});

/* ---------------------------------------------------------- B站 */
async function openBili(){
  openApp('B站', '<div class="empty">读取中…</div>');
  const j = await api('/bili/seen');
  let h = '<div class="card"><h4>最近看过</h4>';
  const items = (j.items || j.seen || []).slice(0, 12);

/* ---------------------------------------------------------- 计算器 */
let cAcc = '0', cPrev = null, cOp = null, cFresh = true;
function ck(k){
  const out = document.getElementById('calcOut');
  if(k === 'C'){ cAcc='0'; cPrev=null; cOp=null; cFresh=true; out.textContent='0'; return; }
  if(k === '±'){ cAcc = cAcc.startsWith('-') ? cAcc.slice(1) : '-'+cAcc;
                 out.textContent = cAcc; return; }
  if(k === '%'){ cAcc = String(parseFloat(cAcc)/100); out.textContent = cAcc; return; }
  if('+-*/'.includes(k)){
    if(cPrev !== null && cOp && !cFresh) cAcc = String(calc(cPrev, parseFloat(cAcc), cOp));
    cPrev = parseFloat(cAcc); cOp = k; cFresh = true;
    out.textContent = cAcc; return;
  }
  if(k === '='){
    if(cPrev !== null && cOp){
      cAcc = String(calc(cPrev, parseFloat(cAcc), cOp));
      out.textContent = cAcc;
      cPrev = null; cOp = null; cFresh = true;
    }
    return;
  }
  if(k === '.'){
    if(cFresh){ cAcc = '0.'; cFresh = false; }
    else if(!cAcc.includes('.')) cAcc += '.';
    out.textContent = cAcc; return;
  }
  if(cFresh){ cAcc = k; cFresh = false; }
  else cAcc = (cAcc === '0' ? k : cAcc + k);
  out.textContent = cAcc;
}
function calc(a,b,op){
  if(op==='+') return a+b;
  if(op==='-') return a-b;
  if(op==='*') return a*b;
  if(op==='/') return b===0 ? 0 : a/b;
  return b;
}
