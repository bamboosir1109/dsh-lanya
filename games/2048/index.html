<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="无需联网的2048小游戏，支持键盘、触屏和方向按钮。">
  <title>2048 · 向下一格</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #253b3b; background: #f7f4ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; background: radial-gradient(ellipse at 80% 0, #e0eae3 0, transparent 55%), #f7f4ec; }
    main { width: min(100%, 440px); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: clamp(54px, 14vw, 76px); letter-spacing: -5px; line-height: 1; margin: 0; }
    .eyebrow { margin: 0 0 12px; font-size: 12px; letter-spacing: 3px; color: #6b827a; }
    .scores { display: flex; gap: 8px; }
    .score { min-width: 74px; padding: 10px 12px; background: #fffaf1; border: 1px solid #dbe2d6; border-radius: 13px; text-align: center; }
    .score span { display: block; font-size: 11px; color: #718078; margin-bottom: 3px; }
    .score strong { font-size: 21px; font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 16px; }
    .toolbar p { margin: 0; font-size: 14px; color: #657b72; }
    button { border: 0; border-radius: 10px; background: #315e52; color: #fffdf6; font: inherit; font-weight: 600; padding: 11px 16px; cursor: pointer; }
    button:hover { background: #244b41; }
    button:focus-visible, #board:focus-visible { outline: 3px solid #e5a846; outline-offset: 4px; }
    #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; border-radius: 18px; background: #a6b4a5; box-shadow: 0 14px 35px #304d4014; touch-action: none; user-select: none; -webkit-user-select: none; }
    .cell { aspect-ratio: 1; min-width: 0; display: grid; place-items: center; border-radius: 10px; background: #bfcbba; color: #334940; font-size: clamp(25px, 8vw, 47px); font-weight: 750; font-variant-numeric: tabular-nums; }
    .cell[data-value="2"] { background: #f4f0df; }
    .cell[data-value="4"] { background: #eee3c5; }
    .cell[data-value="8"] { background: #eec086; }
    .cell[data-value="16"] { background: #e6a077; }
    .cell[data-value="32"] { background: #d9806b; color: #fff9ea; }
    .cell[data-value="64"] { background: #c76258; color: #fff9ea; }
    .cell[data-value="128"] { background: #92b79a; }
    .cell[data-value="256"] { background: #6c9e87; color: #fff9ea; }
    .cell[data-value="512"] { background: #47856e; color: #fff9ea; }
    .cell[data-value="1024"] { background: #376d6b; color: #fff9ea; }
    .cell[data-value="2048"] { background: #cc9f42; color: #fffdf3; }
    .cell.large { font-size: clamp(21px, 6.3vw, 36px); }
    .cell.huge { font-size: clamp(16px, 4.8vw, 28px); background: #38525e; color: #fff; }
    .cell.new { animation: appear 140ms ease-out; }
    @keyframes appear { from { transform: scale(.72); opacity: .5; } to { transform: scale(1); opacity: 1; } }
    #status { margin: 16px 0 8px; min-height: 24px; font-weight: 600; font-size: 15px; }
    #status[data-state="over"] { color: #ae493d; }
    #status[data-state="won"] { color: #976c13; }
    .controls { display: grid; width: 156px; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 18px auto; }
    .controls button { padding: 9px; font-size: 20px; background: #e0e6d9; color: #35574a; }
    .controls button:hover { background: #cfdac7; }
    .controls [data-direction="up"] { grid-column: 2; }
    .controls [data-direction="left"] { grid-column: 1; }
    footer { padding: 0 4px; color: #7b877b; font-size: 12px; line-height: 1.8; text-align: center; }
    footer p { margin: 4px 0; }
    noscript { display: block; margin: 16px 0; color: #a33; }
    @media (max-width: 360px) { .score { min-width: 60px; padding: 8px; } #board { gap: 7px; padding: 7px; } }
    @media (prefers-reduced-motion: reduce) { .cell.new { animation: none; } }
  </style>
  <script src="./game.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">离线小游戏 · 向下一格</p>
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score"><span>分数</span><strong id="score">0</strong></div>
        <div class="score"><span>最高</span><strong id="best">0</strong></div>
      </div>
    </header>
    <div class="toolbar"><p>相同数字碰在一起，就合并。</p><button id="restart" type="button">重新开始</button></div>
    <div id="board" role="grid" aria-label="2048棋盘" aria-rowcount="4" aria-colcount="4" tabindex="0"></div>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="controls" aria-label="方向控制">
      <button type="button" data-direction="up" aria-label="向上">↑</button>
      <button type="button" data-direction="left" aria-label="向左">←</button>
      <button type="button" data-direction="down" aria-label="向下">↓</button>
      <button type="button" data-direction="right" aria-label="向右">→</button>
    </div>
    <footer><p>方向键 / WASD，或在棋盘上滑动。</p><p>合成2048后可以继续。最高分只保存在本机。</p></footer>
    <noscript>请启用JavaScript以运行游戏；无需联网。</noscript>
  </main>
</body>
</html>
